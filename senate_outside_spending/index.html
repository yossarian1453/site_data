<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senate Outside Spending</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb;
    --ink: #1d1d1b;
    --ink-2: #4a4a46;
    --ink-3: #75746e;
    --rule: #dcdad3;
    --grid: #ebe9e3;
    --focus: #1b3b8c;
    /* same colors per group as the population chart */
    --s-dem: #2a78d6;
    --s-rep: #cc3a47;
    --s-dem-2: #9cc2ee;
    --s-rep-2: #eba3aa;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.35rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  .dek { margin: 0 0 14px; color: var(--ink-2); font-size: 0.95rem; line-height: 1.45; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { font: inherit; font-size: 0.875rem; padding: 7px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 6px; padding: 0; list-style: none; }
  .legend button {
    font: inherit; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .legend button[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
  .legend button[aria-pressed="false"] .sw { opacity: 0.25; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  button:focus-visible, svg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: var(--grid); }
  .grid .domain { display: none; }
  .axis text { fill: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis .domain, .axis line { stroke: var(--rule); }
  .axis.x text { fill: var(--ink-2); font-size: 12.5px; font-weight: 600; }
  .lbl { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .end-lbl { font-size: 12px; font-weight: 600; }
  .tip .gap { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--ink-2); display: flex; justify-content: space-between; gap: 12px; }
  .tip .gap b { font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--bg); stroke-width: 2px; }
  .guide { stroke: var(--ink); stroke-width: 1px; }
  .hit { fill: transparent; cursor: crosshair; }

  .tip {
    position: absolute; z-index: 5; pointer-events: none; min-width: 210px;
    background: #fff; border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.14);
    padding: 10px 12px; font-size: 0.85rem; line-height: 1.45; display: none;
  }
  .tip h3 { margin: 0 0 6px; font-size: 0.95rem; }
  .tip .row { display: flex; align-items: center; gap: 8px; }
  .tip .row .name { flex: 1; color: var(--ink-2); }
  .tip .row .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tip .row .val.na { font-weight: 400; color: var(--ink-3); }

  footer { margin-top: 14px; font-size: 0.8rem; line-height: 1.5; color: var(--ink-3); }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--ink-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .error { padding: 16px; border: 1px solid #cc3a47; border-radius: 8px; color: #8a1320; background: #fff; }

  .bars { margin: 6px 0 4px; }
  .bar-row { margin-bottom: 14px; }
  .bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .bar-head b { font-size: 1rem; color: var(--c); }
  .bar-head span { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .track { display: flex; height: 30px; border-radius: 4px; overflow: hidden; background: var(--grid); }
  .seg-bar { height: 100%; min-width: 2px; }
  .seg-bar.support { background: var(--c); }
  .seg-bar.oppose { background: var(--c2); }
  .seg-bar + .seg-bar { border-left: 2px solid var(--bg); }
  .bar-sub { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 5px; font-size: 0.8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .bar-sub i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin-top: 18px; }
  .top h2 { font-size: 0.9rem; margin: 0 0 6px; color: var(--c); }
  .top ol { margin: 0; padding: 0; list-style: none; font-size: 0.85rem; }
  .top li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .top li span:first-child { color: var(--ink); }
  .top li span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .top .more { font-size: 0.75rem; color: var(--ink-3); margin-top: 4px; }
  @media (max-width: 560px) { .top { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap" id="app">
  <h1>Outside money in the Texas Senate race</h1>
  <p class="dek">Independent spending by super PACs, party groups and other organizations, sorted by which candidate it helps.</p>

  <div class="bars" id="bars"></div>
  <div class="top" id="top"></div>
  <footer id="notes"></footer>
</main>

<script src="app.js"></script>
</body>
</html>
