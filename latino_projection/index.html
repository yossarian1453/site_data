<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Latino Vote Math</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb;
    --ink: #1d1d1b;
    --ink-2: #4a4a46;
    --ink-3: #75746e;
    --rule: #dcdad3;
    --grid: #ebe9e3;
    --focus: #1b3b8c;
    --s-dem: #2a78d6;
    --s-rep: #cc3a47;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.35rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  .dek { margin: 0 0 14px; color: var(--ink-2); font-size: 0.95rem; line-height: 1.45; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { font: inherit; font-size: 0.85rem; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; color: var(--ink-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  footer { margin-top: 14px; font-size: 0.8rem; line-height: 1.5; color: var(--ink-3); }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--ink-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .error { padding: 16px; border: 1px solid #cc3a47; border-radius: 8px; color: #8a1320; background: #fff; }
  table.proj { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .proj caption { text-align: left; font-size: 0.85rem; color: var(--ink-2); margin-bottom: 6px; }
  .proj th, .proj td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .proj th:first-child, .proj td:first-child { text-align: left; white-space: normal; }
  .proj thead th { font-size: 0.78rem; font-weight: 600; color: var(--ink-3); border-bottom: 1px solid var(--ink-3); vertical-align: bottom; white-space: normal; }
  .table-wrap { overflow-x: auto; }
  .proj tbody th { font-weight: 600; }
  .proj tr.base td, .proj tr.base th { background: #f3f2ee; }
  .proj tr.key td, .proj tr.key th { font-weight: 700; }
  .proj .sub { display: block; font-size: 0.75rem; font-weight: 400; color: var(--ink-3); }
  .net-d { color: var(--s-dem); font-weight: 700; }
  .net-r { color: var(--s-rep); font-weight: 700; }
  .sep td, .sep th { border-bottom: 2px solid var(--ink-3); }
  .net-d b, .net-r b { white-space: nowrap; }
  @media (max-width: 860px) { .cand { display: none; } }
  @media (max-width: 600px) {
    .chg { display: none; }
    .proj th, .proj td { padding: 8px 5px; white-space: normal; }
    .proj { font-size: 0.8rem; }
  }
</style>
</head>
<body>
<main class="wrap" id="app">
  <h1>What the latest poll implies for Latino votes in Texas</h1>
  <p class="dek" id="dek">Latino registered voters × midterm turnout × the poll's margin, compared with the 2024 presidential race.</p>

  <div class="controls">
    <div class="seg" role="group" aria-label="Poll" id="polls"></div>
  </div>

  <div class="table-wrap"><table class="proj" id="table"></table></div>
  <footer id="notes"></footer>
</main>

<script src="app.js"></script>
</body>
</html>
