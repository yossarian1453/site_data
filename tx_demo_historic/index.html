<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Population by Race</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb;
    --ink: #1d1d1b;
    --ink-2: #4a4a46;
    --ink-3: #75746e;
    --rule: #dcdad3;
    --grid: #ebe9e3;
    --focus: #1b3b8c;
    /* categorical slots 2-7 of the reference palette, in validated order */
    --s-white: #eb6834;
    --s-black: #1baf7a;
    --s-other: #eda100;
    --s-multi: #e87ba4;
    --s-api:   #008300;
    --s-aian:  #6250d6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.35rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  .dek { margin: 0 0 14px; color: var(--ink-2); font-size: 0.95rem; line-height: 1.45; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { font: inherit; font-size: 0.875rem; padding: 7px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 6px; padding: 0; list-style: none; }
  .legend button {
    font: inherit; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .legend button[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
  .legend button[aria-pressed="false"] .sw { opacity: 0.25; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  button:focus-visible, svg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: var(--grid); }
  .grid .domain { display: none; }
  .axis text { fill: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis .domain, .axis line { stroke: var(--rule); }
  .line { fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--bg); stroke-width: 2px; }
  .break line { stroke: var(--ink-3); stroke-dasharray: 3 3; }
  .break text { fill: var(--ink-3); font-size: 11px; }
  .guide { stroke: var(--ink); stroke-width: 1px; }
  .hit { fill: transparent; cursor: crosshair; }

  .tip {
    position: absolute; z-index: 5; pointer-events: none; min-width: 220px;
    background: #fff; border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.14);
    padding: 10px 12px; font-size: 0.85rem; line-height: 1.45; display: none;
  }
  .tip h3 { margin: 0 0 6px; font-size: 0.95rem; }
  .tip .row { display: flex; align-items: center; gap: 8px; }
  .tip .row .name { flex: 1; color: var(--ink-2); }
  .tip .row .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tip .total { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; }

  footer { margin-top: 14px; font-size: 0.8rem; line-height: 1.5; color: var(--ink-3); }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--ink-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .error { padding: 16px; border: 1px solid #cc3a47; border-radius: 8px; color: #8a1320; background: #fff; }
</style>
</head>
<body>
<main class="wrap" id="app">
  <h1>Texas population by race, 1980–2020</h1>
  <p class="dek">How the racial makeup of Texas has changed across five censuses. Hover or tap the chart to see each year.</p>

  <div class="controls">
    <div class="seg" role="group" aria-label="Measure">
      <button type="button" data-measure="share" aria-pressed="true">Share of population</button>
      <button type="button" data-measure="count" aria-pressed="false">Number of people</button>
    </div>
  </div>
  <ul class="legend" id="legend" aria-label="Show or hide groups"></ul>

  <div class="chart" id="chart">
    <svg id="svg" tabindex="0" role="img" aria-label="Line chart of Texas population by race, 1980 to 2020. Use the left and right arrow keys to step through years."></svg>
    <div class="tip" id="tip" role="status" aria-live="polite"></div>
  </div>

  <table class="sr-only" id="srTable"></table>
  <footer id="notes"></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
